name: EELE October 2026 live monitor

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: eele-live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      POLL_SECONDS: '20'
      HEARTBEAT_SECONDS: '300'
      FORCE_FETCH_SECONDS: '300'
      MAX_HOURS: '5.25'
      SENT_STATE_FILE: sent-state.json
      GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      GH_TOKEN: ${{ github.token }}
      STOP_DATE: '20261030'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Queue the next live window
        continue-on-error: true
        shell: bash
        run: |
          if [ -f sent-state.json ]; then
            echo "List already delivered; not queueing another run."
            exit 0
          fi
          if [ "$(date -u +%Y%m%d)" \< "$STOP_DATE" ]; then
            gh workflow run eele-monitor.yml --ref main
            echo "Queued the next live window."
          else
            echo "Stop date reached; not queueing another run."
          fi

      - name: Monitor every 20 seconds, ping Telegram every 5 minutes
        run: node monitor-ele.js --live

      - name: Save delivered marker
        if: always()
        shell: bash
        run: |
          if [ ! -f sent-state.json ]; then
            echo "Nothing delivered yet; no marker to save."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sent-state.json
          if git diff --cached --quiet; then
            echo "Marker already committed."
            exit 0
          fi
          git commit -m "Mark EELE list as delivered [skip ci]"
          git push

      - name: Queue another live window if not delivered
        if: always() && !cancelled()
        continue-on-error: true
        shell: bash
        run: |
          if [ -f sent-state.json ]; then
            echo "List already delivered; not queueing another run."
            exit 0
          fi
          if [ "$(date -u +%Y%m%d)" \< "$STOP_DATE" ]; then
            gh workflow run eele-monitor.yml --ref main
            echo "Queued the next live window."
          else
            echo "Stop date reached; not queueing another run."
          fi

      - name: Upload extracted list
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eele-g-passers
          path: |
            passers-g.txt
            passers-g.json
          if-no-files-found: ignore
          retention-days: 7
